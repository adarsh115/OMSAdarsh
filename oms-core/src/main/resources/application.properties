spring.application.name=oms-core
server.port=8282

# Disable DevTools (fixes Kafka Avro deserialization ClassCastException)
spring.devtools.restart.enabled=false

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.properties.schema.registry.url=http://localhost:8081

#Avro serializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

# Avro deserialization
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer

# Consumer group ID
spring.kafka.consumer.group-id=oms-core
# Start from beginning if no offset is committed
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.properties.specific.avro.reader=true

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/omscoredb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.web=DEBUG