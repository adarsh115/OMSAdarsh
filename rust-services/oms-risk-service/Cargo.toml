[package]
name = "oms-risk-service"
version = "0.1.0"
edition = "2024"
build = "build.rs"


[dependencies]
tokio = { version = "1", features = ["full"] }
rdkafka = { version = "0.34", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.12"
prost-types = "0.12"
config = "0.13"
log = "0.4"
env_logger = "0.10"


[build-dependencies]
prost-build = "0.12"
