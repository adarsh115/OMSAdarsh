spring.application.name=oms-matching-engine

server.port=8085

# Kafka broker and schema registry
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.properties.schema.registry.url=http://localhost:8081

# Avro serialization for producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

# Optional: Producer acks and retries for reliability
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Kafka consumer (Avro)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer

# Schema Registry
spring.kafka.consumer.properties.schema.registry.url=http://localhost:8081
spring.kafka.consumer.properties.specific.avro.reader=true

# Consumer group and offset behavior
spring.kafka.consumer.group-id=oms-matching-engine
spring.kafka.consumer.auto-offset-reset=earliest


# Management endpoints for observability
management.endpoints.web.exposure.include=health,info,metrics,env,beans,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

# Logging level
logging.level.com.adarsh.oms.oms_market_data=INFO

# Log to file
logging.file.name=oms-market-data/logs/market-data.log

logging.file.max-size=10MB
logging.file.max-history=7
